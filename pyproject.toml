[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-forecasting-io"
version = "0.1.0"
description = "Hourly electricity price forecasting and input-output scenario analysis"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
